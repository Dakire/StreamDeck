# Compilation et tests à chaque poussée et demande de fusion.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Compilation (avertissements = erreurs)
        run: dotnet build -c Release --nologo
      - name: Tests
        run: dotnet test tests/StreamDak.Tests -c Release --nologo
      - name: Vulnérabilités des dépendances
        shell: pwsh
        run: |
          $out = dotnet list StreamDak.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'Dépendance vulnérable' }
